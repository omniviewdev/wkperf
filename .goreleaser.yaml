version: 2
project_name: wkperf

builds:
  - main: .
    binary: wkperf
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/omniviewdev/wkperf/cmd.Version={{ .Version }}
      - -X github.com/omniviewdev/wkperf/cmd.Commit={{ .ShortCommit }}
      - -X github.com/omniviewdev/wkperf/cmd.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
